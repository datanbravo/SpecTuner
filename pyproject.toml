[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectuner"
version = "0.1.0"
description = "A Python harness for evidence-driven game performance optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2"]

[project.scripts]
spectuner = "spectuner.cli:main"

[tool.setuptools.packages.find]
include = ["spectuner*"]
